<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fourierizer H0 Spike</title>
<style>
  /* Tokens copied from docs/design/system/project/tokens.json (v0). */
  :root {
    --chassis: #E4E7EA; --panel: #F3F5F6; --display: #FFFFFF; --ink: #16181A; --ink-muted: #5A6068; --seam: #B7BDC3;
    --layer-1: #F28C28; --layer-2: #10A04A; --layer-2-deep: #0B7A36; --layer-3: #0085CA; --layer-4: #7A3FD1; --signal-rec: #E5322D;
    --sans: "Segoe UI", "Helvetica Neue", Arial, sans-serif;  /* Archivo / Plex get embedded in H5; system faces for the spike */
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--chassis); color: var(--ink); font-family: var(--sans); padding: 24px; display: grid; grid-template-rows: auto 1fr auto; gap: 20px; user-select: none; }
  header { display: flex; align-items: baseline; gap: 14px; }
  .wordmark { font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
  .silk { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 20px; align-content: start; }
  .module { position: relative; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 6px; padding: 26px 16px 16px; display: grid; gap: 12px; align-content: start; }
  .screw { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 2.5px; height: 1.5px; background: var(--ink); transform: rotate(-35deg); }
  .tl { left: 6px; top: 6px; } .tr { right: 6px; top: 6px; }
  .num { width: 24px; height: 24px; display: inline-grid; place-items: center; border: 1.5px solid var(--ink); border-radius: 3px; font: 600 13px var(--mono); }
  .head { display: flex; align-items: center; gap: 10px; }
  .head b { font-size: 15px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .led { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); background: var(--panel); flex: none; }
  .led.on { background: var(--layer-2); }
  .big { font: 600 22px/26px var(--mono); }
  /* knob */
  .knob { display: grid; justify-items: center; gap: 6px; }
  .dial { position: relative; width: 72px; height: 72px; cursor: ns-resize; touch-action: none; }
  .cap { position: absolute; left: 12px; top: 12px; width: 48px; height: 48px; border-radius: 50%; background: var(--layer-1); border: 1.5px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .cap::after { content: ""; position: absolute; left: calc(50% - 1.5px); top: 4px; width: 3px; height: 14px; border-radius: 2px; background: var(--ink); }
  /* meter */
  .meter { height: 18px; border: 1.5px solid var(--ink); background: var(--display); position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--layer-3); }
  footer { font: 11px/16px var(--mono); color: var(--ink-muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .err { color: var(--signal-rec); }
</style>
</head>
<body>
  <header><span class="wordmark">Fourierizer</span><span class="silk">H0 spike · 3 tests</span></header>
  <main>
    <section class="module" aria-labelledby="t1">
      <span class="screw tl"></span><span class="screw tr"></span>
      <div class="head"><span class="num">1</span><b id="t1">MIDI → sound</b></div>
      <div class="status"><span class="led" id="midiLed"></span><span id="midiText">Play a note on your keyboard</span></div>
      <div><span class="big" id="voices">0</span> <span class="silk">voices</span></div>
    </section>
    <section class="module" aria-labelledby="t2">
      <span class="screw tl"></span><span class="screw tr"></span>
      <div class="head"><span class="num">2</span><b id="t2">UI ↔ parameter</b></div>
      <div class="knob">
        <div class="dial" id="dial" tabindex="0" role="slider" aria-label="Gain"><svg viewBox="0 0 72 72" width="72" height="72" id="ticks" aria-hidden="true"></svg><div class="cap" id="cap"></div></div>
        <span class="mono" id="gainText">— dB</span><span class="silk">Gain</span>
      </div>
      <div class="status"><span class="led" id="paramLed"></span><span id="paramText">Drag the knob, or move Gain from FL</span></div>
    </section>
    <section class="module" aria-labelledby="t3">
      <span class="screw tl"></span><span class="screw tr"></span>
      <div class="head"><span class="num">3</span><b id="t3">Sidechain in</b></div>
      <div class="meter"><i id="meterBar"></i></div>
      <div><span class="big" id="scDb">−∞</span> <span class="silk">dBFS</span></div>
      <div class="status"><span class="led" id="scLed"></span><span id="scText">Route a mixer track to this plugin's input</span></div>
    </section>
  </main>
  <footer id="info"><span>Connecting to the plugin…</span></footer>
  <script type="module" src="main.js"></script>
</body>
</html>
