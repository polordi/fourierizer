<!-- @dsCard group="Displays" height=330 subtitle="A layer's STFT magnitude in its own color, with selections; drag to draw a rectangle" -->
<div class="fz fz-chassis" id="root">
  <div class="fz-l1" style="display:grid;gap:6px;max-width:640px">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <span class="fz-silk">L1 · Hann · N 4096 · H 512</span>
      <span class="fz-readout-sm" id="cursor">—</span>
    </div>
    <div style="display:grid;grid-template-columns:34px 1fr;gap:4px">
      <div id="yaxis" style="position:relative"></div>
      <div class="fz-display" style="position:relative;aspect-ratio:2.6/1">
        <canvas id="spec" style="position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated"></canvas>
        <svg id="sel" style="position:absolute;inset:0;width:100%;height:100%;cursor:crosshair" aria-label="Spectrogram selection area"></svg>
      </div>
      <span></span>
      <div id="xaxis" style="position:relative;height:14px"></div>
    </div>
  </div>
</div>
<script>
(() => {
  const DUR = 3.84, FMIN = 30, FMAX = 20000, W = 260, H = 100;
  const host = document.querySelector(".fz-l1");
  const cv = document.createElement("canvas").getContext("2d");
  const rgb = s => { cv.fillStyle = "#000"; cv.fillStyle = s.trim(); const h = cv.fillStyle; return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); };
  const cs = getComputedStyle(host);
  const ground = rgb(cs.getPropertyValue("--display") || "#FFFFFF"), mid = rgb(cs.getPropertyValue("--layer")), deep = rgb(cs.getPropertyValue("--layer-deep"));
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  // Colormap: display ground → layer → layer-deep (flat stops, so peaks keep ≥3:1 on the ground).
  const cmap = v => v < 0.6 ? mix(ground, mid, v / 0.6) : mix(mid, deep, (v - 0.6) / 0.4);
  const yToF = y => FMIN * (FMAX / FMIN) ** (1 - y);   // y ∈ [0,1] top→bottom, log-frequency axis

  // Synthetic piano-like note: f0 = 196 Hz (G3), slightly inharmonic partials, frequency-dependent decay, hammer noise.
  const spec = document.getElementById("spec"); spec.width = W; spec.height = H;
  const ctx = spec.getContext("2d"), img = ctx.createImageData(W, H);
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const m = new Float32Array(W * H); let mx = 0;
  for (let x = 0; x < W; x++) { const t = x / W * DUR;
    for (let y = 0; y < H; y++) { const f = yToF(y / H); let v = 0;
      for (let k = 1; k <= 30; k++) { const fk = 196 * k * Math.sqrt(1 + 0.0004 * k * k), d = Math.log2(f / fk) * 30; v += Math.exp(-d * d) * Math.exp(-t * (0.6 + 0.25 * k)) / k ** 0.8; }
      v += (t < 0.05 ? (0.05 - t) * 14 * rnd() : 0) + 0.015 * rnd();
      m[y * W + x] = v; mx = Math.max(mx, v); } }
  for (let i = 0; i < m.length; i++) { const c = cmap(Math.min(1, (m[i] / mx) ** 0.42)); img.data.set([c[0], c[1], c[2], 255], i * 4); }
  ctx.putImageData(img, 0, 0);

  // Axes: log-spaced Hz ticks and seconds.
  const fToY = f => 1 - Math.log(f / FMIN) / Math.log(FMAX / FMIN);
  document.getElementById("yaxis").innerHTML = [50, 100, 200, 500, 1000, 2000, 5000, 10000].map(f =>
    `<span class="fz-readout-sm" style="position:absolute;right:0;top:calc(${(fToY(f) * 100).toFixed(2)}% - 6px)">${f >= 1000 ? f / 1000 + "k" : f}</span>`).join("");
  document.getElementById("xaxis").innerHTML = [0, 1, 2, 3].map(s =>
    `<span class="fz-readout-sm" style="position:absolute;left:${(s / DUR * 100).toFixed(2)}%">${s} s</span>`).join("");

  // Selections live in physical units (seconds, Hz) and are drawn in viewBox space 0…1000 × 0…1000.
  const svg = document.getElementById("sel");
  svg.setAttribute("viewBox", "0 0 1000 1000"); svg.setAttribute("preserveAspectRatio", "none");
  const toX = t => t / DUR * 1000, toY = f => fToY(f) * 1000;
  const shapes = [
    { kind: "rect", t: [0.0, 2.2], f: [150, 1100] },
    { kind: "lasso", pts: [[2.4, 900], [3.1, 2600], [3.6, 1800], [3.4, 700], [2.8, 500]] },
  ];
  const style = `fill:var(--layer);fill-opacity:.16;stroke:var(--ink,#16181A);stroke-width:2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke`;
  const handle = (x, y) => `<rect x="${x - 6}" y="${y - 14}" width="12" height="28" style="fill:var(--layer-deep);stroke:var(--ink,#16181A);stroke-width:1.5;vector-effect:non-scaling-stroke"/>`;
  function draw(extra) {
    svg.innerHTML = [...shapes, ...(extra ? [extra] : [])].map(s => s.kind === "rect"
      ? `<rect x="${toX(s.t[0])}" y="${toY(s.f[1])}" width="${toX(s.t[1]) - toX(s.t[0])}" height="${toY(s.f[0]) - toY(s.f[1])}" style="${style}"/>${handle(toX(s.t[0]), toY(s.f[1]))}${handle(toX(s.t[1]), toY(s.f[0]))}`
      : `<polygon points="${s.pts.map(([t, f]) => `${toX(t)},${toY(f)}`).join(" ")}" style="${style}"/>`).join("") +
      `<line x1="${toX(1.3)}" x2="${toX(1.3)}" y1="0" y2="1000" style="stroke:var(--ink,#16181A);stroke-width:1.5;vector-effect:non-scaling-stroke"/>`;
  }
  draw();
  const at = e => { const r = svg.getBoundingClientRect(); const u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    return [Math.min(DUR, Math.max(0, u * DUR)), yToF(Math.min(1, Math.max(0, v)))]; };
  const fmtF = f => f >= 1000 ? (f / 1000).toFixed(2) + " kHz" : f.toFixed(0) + " Hz";
  let start = null;
  svg.addEventListener("pointerdown", e => { svg.setPointerCapture(e.pointerId); start = at(e); });
  svg.addEventListener("pointermove", e => { const [t, f] = at(e); document.getElementById("cursor").textContent = `${t.toFixed(3)} s · ${fmtF(f)}`;
    if (start && svg.hasPointerCapture(e.pointerId)) draw({ kind: "rect", t: [Math.min(start[0], t), Math.max(start[0], t)], f: [Math.min(start[1], f), Math.max(start[1], f)] }); });
  svg.addEventListener("pointerup", e => { if (!start) return; const [t, f] = at(e);
    if (Math.abs(t - start[0]) > 0.02) shapes.push({ kind: "rect", t: [Math.min(start[0], t), Math.max(start[0], t)], f: [Math.min(start[1], f), Math.max(start[1], f)] });
    if (shapes.length > 5) shapes.splice(2, 1);
    start = null; draw(); });
})();
</script>
