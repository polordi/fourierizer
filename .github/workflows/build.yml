# Continuous integration: build every plugin (Fourierizer and the H0 spike) on Windows and macOS, then validate it with
# pluginval. Runs on every push and pull request; built plugins are attached as artifacts.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            pluginval_zip: pluginval_Windows.zip
            pluginval_bin: pluginval.exe
          - name: macOS
            os: macos-latest
            pluginval_zip: pluginval_macOS.zip
            pluginval_bin: pluginval.app/Contents/MacOS/pluginval

    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force -ErrorAction SilentlyContinue | Out-Null
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force | Out-Null

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Node (the plugin embeds the web UI)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI dependencies
        working-directory: ui
        run: npm ci

      - name: Configure
        shell: bash
        run: cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build/release --parallel

      - name: Core golden tests
        shell: bash
        run: ctest --test-dir build/release/core --output-on-failure

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval_zip }}"
          unzip -q -o pluginval.zip -d pluginval

      - name: Validate plugins
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          for p in build/release/plugin/*_artefacts/Release/VST3/*.vst3 build/release/spikes/*/*_artefacts/Release/VST3/*.vst3; do
            echo "::group::pluginval $p"
            "./pluginval/${{ matrix.pluginval_bin }}" --strictness-level 8 --skip-gui-tests --validate-in-process --validate "$p" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ runner.os }}
          path: |
            build/release/plugin/*_artefacts/Release/VST3/*.vst3
            build/release/spikes/*/*_artefacts/Release/VST3/*.vst3
          if-no-files-found: error

  core-linux:
    name: C++ core (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S core -B build/core -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/core --parallel
      - name: Golden tests          # must reproduce python/golden/data to 1e-9
        run: ctest --test-dir build/core --output-on-failure
      - name: Benchmark (10 s of audio per layer)
        run: build/core/fourierizer-core-bench 10

  python-reference:
    name: Python reference engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  ui:
    name: UI and web engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test            # must reproduce python/golden/data to 1e-9
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fourierizer-ui
          path: ui/dist/

  theory:
    name: Theory document (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate figures and tables
        run: |
          pip install -e "python[dev]"
          python python/examples/theory_figures.py
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/theory
          root_file: main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: fourierizer-teoria
          path: docs/theory/main.pdf
          if-no-files-found: error
